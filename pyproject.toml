[project]
name = "quranic-scholar-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
quranic-scholar-mcp = "quranic_scholar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quranic_scholar"]

dependencies = [
    "mcp[cli]>=1.27.0",
    "pyarabic>=0.6.15",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
